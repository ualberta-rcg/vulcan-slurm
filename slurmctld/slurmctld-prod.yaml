# --- MetalLB address pool + L2 advertisement for the three controllers -----
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: slurmctld-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.0.2.15-192.0.2.17
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: slurmctld-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - slurmctld-pool
---
# =============================================================================
# Vulcan Slurm — slurmctld controllers (3x: primary + 2 backups)
# =============================================================================
# HA model (matches slurm.conf on NFS, three ordered SlurmctldHost lines):
#   slurmctld-1 (192.0.2.15) = primary
#   slurmctld-2 (192.0.2.16) = backup1   (takes over after SlurmctldTimeout=120s)
#   slurmctld-3 (192.0.2.17) = backup2
# Only ONE controller is ever active; backups idle in standby watching the
# shared NFS StateSaveLocation heartbeat. This replaces the old broken
# "comma-separated SlurmctldHost" setup that allowed concurrent state writers
# (lost jobs / reconfig segfaults).
#
# strategy: Recreate is REQUIRED — RollingUpdate would briefly run two copies
# of the same controller against the same NFS state dir on every image bump.
#
# Image is version-pinned; bump deliberately (dbd first on major upgrades).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slurmctld-1
  namespace: slurm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: slurmctld
      instance: "1"
  template:
    metadata:
      labels:
        app: slurmctld
        instance: "1"
    spec:
      hostname: slurmctld-1
      # Spread the controllers across different mgmt nodes when possible.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: slurmctld
              topologyKey: kubernetes.io/hostname
      containers:
      - name: slurmctld
        image: rkhoja/vulcan-slurm:slurmctld-26-05-3-1
        imagePullPolicy: Always
        # Mail relay for job notifications; the image ships placeholders and
        # the entrypoint regenerates /etc/msmtprc from these at start.
        env:
        - name: SMTP_HOST
          value: smtp.example.org
        - name: SMTP_PORT
          value: "25"
        - name: MAIL_FROM
          value: slurm-alerts@example.org
        ports:
        - containerPort: 6817
          name: 6817tcp
          protocol: TCP
        # Liberal requests/limits — the controller is the cluster brain.
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "8"
            memory: 16Gi
        # Startup: state recovery on a big job_state can take minutes.
        startupProbe:
          tcpSocket:
            port: 6817
          periodSeconds: 10
          failureThreshold: 30      # up to 5 minutes to come up
        livenessProbe:
          tcpSocket:
            port: 6817
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 6817
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: nfs-munge-key
          mountPath: /etc/munge/.secret/
        - name: slurm-config
          mountPath: /etc/slurm
        - name: slurmctld-state
          mountPath: /var/spool/slurmctld
        - name: sssd-config
          mountPath: /etc/sssd/.secret/
      volumes:
      - name: nfs-munge-key
        nfs:
          server: nfs.example.org
          path: /exports/slurm/etc/munge
      - name: slurm-config
        nfs:
          server: nfs.example.org
          path: /exports/slurm/etc/slurm
      - name: slurmctld-state
        nfs:
          server: nfs.example.org
          path: /exports/slurm/var/spool/slurmctld
      - name: sssd-config
        nfs:
          server: nfs.example.org
          path: /exports/slurm/etc/sssd
      # Controllers and LDAP resolve via stable LB IPs (not pod IPs).
      hostAliases:
      - ip: 192.0.2.15
        hostnames: ["slurmctld-1"]
      - ip: 192.0.2.16
        hostnames: ["slurmctld-2"]
      - ip: 192.0.2.17
        hostnames: ["slurmctld-3"]
      - ip: 192.0.2.29
        hostnames: ["ldap1.example.org"]
      - ip: 192.0.2.30
        hostnames: ["ldap2.example.org"]
---
