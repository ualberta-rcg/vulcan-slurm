# --- LoadBalancer service for slurmctld-1 (stable IP for SlurmctldHost line 1)
apiVersion: v1
kind: Service
metadata:
  labels:
    app: slurmctld
    instance: "1"
  name: slurmctld-service-1
  namespace: slurm
spec:
  type: LoadBalancer
  loadBalancerIP: 192.0.2.15
  # Restrict to the cluster networks and the pod/service CIDRs
  loadBalancerSourceRanges:
    - 192.0.2.0/24
    - 10.42.0.0/16
    - 10.43.0.0/16
  externalTrafficPolicy: Local
  ports:
    - name: slurmctld
      port: 6817
      protocol: TCP
      targetPort: 6817
  selector:
    app: slurmctld
    instance: "1"
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
